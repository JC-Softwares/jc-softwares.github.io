<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JC-Softwares | Gerador de QR Code Offline</title>
    <!-- Biblioteca QRCode.js via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg-main: #121212;
            --bg-card: #1e1e1e;
            --border-color: #333333;
            --accent-blue: #0d47a1;
            --accent-blue-hover: #1565c0;
            --text-main: #e0e0e0;
            --text-muted: #aaaaaa;
            --danger: #c62828;
            --danger-hover: #d32f2f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: #000000;
            color: #ffffff;
            padding: 16px 24px;
            text-align: left;
            font-size: 1.25rem;
            font-weight: 600;
            box-shadow: 0 4px 6px rgba(0,0,0,0.4);
            border-bottom: 2px solid var(--accent-blue);
        }

        header a {
            color: #ffffff;
            text-decoration: none;
        }

        header a span {
            color: #1e88e5;
        }

        header a:hover {
            opacity: 0.9;
        }

        .container {
            max-width: 900px;
            margin: 20px auto;
            padding: 0 15px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
            flex: 1;
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }

        .card h2 {
            font-size: 1.1rem;
            margin-bottom: 12px;
            color: var(--text-main);
            border-bottom: 2px solid var(--accent-blue);
            padding-bottom: 6px;
        }

        textarea {
            width: 100%;
            height: 110px;
            background-color: #2a2a2a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            padding: 12px;
            font-size: 0.95rem;
            resize: none;
            margin-bottom: 12px;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            min-width: 130px;
            background-color: var(--accent-blue);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 15px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--accent-blue-hover);
        }

        button.btn-secondary {
            background-color: #424242;
        }
        button.btn-secondary:hover {
            background-color: #616161;
        }

        button.btn-danger {
            background-color: var(--danger);
        }
        button.btn-danger:hover {
            background-color: var(--danger-hover);
        }

        .history-list {
            max-height: 280px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .history-item {
            background-color: #2a2a2a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .history-info {
            overflow: hidden;
            flex: 1;
        }

        .history-text {
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-main);
        }

        .history-date {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .history-actions {
            display: flex;
            gap: 5px;
        }

        .history-actions button {
            padding: 6px 10px;
            font-size: 0.8rem;
            min-width: auto;
            flex: unset;
        }

        .footer-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        /* --- MODAL RESPONSIVO COM SELETOR DE GRADE --- */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 15px;
            overflow-y: auto;
        }

        .modal-content {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-content h3 {
            margin-bottom: 12px;
            font-size: 1.1rem;
            color: var(--text-main);
        }

        .config-grade {
            margin-bottom: 15px;
            width: 100%;
            text-align: left;
        }

        .config-grade label {
            font-size: 0.85rem;
            color: var(--text-muted);
            display: block;
            margin-bottom: 5px;
        }

        .config-grade select {
            width: 100%;
            background-color: #2a2a2a;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 8px;
            font-size: 0.9rem;
        }

        .preview-box {
            background: white;
            padding: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
            min-height: 180px;
            width: 100%;
        }

        .modal-buttons {
            display: flex;
            gap: 8px;
            width: 100%;
            flex-wrap: wrap;
        }

        .modal-buttons button {
            flex: 1;
            min-width: 90px;
            padding: 8px 10px;
            font-size: 0.85rem;
        }

        /* --- ESTILOS DE IMPRESSÃO DA GRADE A4 --- */
        .print-sheet {
            display: none;
        }

        @media print {
            body * {
                visibility: hidden;
            }
            .print-sheet, .print-sheet * {
                visibility: visible;
            }
            .print-sheet {
                display: grid !important;
                position: absolute;
                left: 0;
                top: 0;
                width: 100vw;
                height: 100vh;
                background: white;
                box-sizing: border-box;
                padding: 10mm;
                justify-items: center;
                align-items: center;
            }
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html">JC-<span>Softwares</span></a>
    </header>

    <div class="container">
        <!-- Caixa de Geração -->
        <div class="card">
            <h2>Novo QR Code</h2>
            <textarea id="textoInput" placeholder="Digite ou cole o texto/link aqui..."></textarea>
            
            <div class="btn-group">
                <button class="btn-secondary" onclick="colarDaAreaDeTransferencia()">Colar</button>
                <button onclick="dispararGeracao()">Gerar QR Code</button>
            </div>
        </div>

        <!-- Histórico -->
        <div class="card">
            <h2>Histórico Recente</h2>
            <div class="history-list" id="listaHistorico"></div>
        </div>

        <!-- Ações Globais -->
        <div class="card footer-actions">
            <span style="font-size: 0.8rem; color: var(--text-muted);">Uso local seguro (Offline).</span>
            <div style="display: flex; gap: 8px; width: 100%;">
                <button class="btn-secondary" onclick="exportarTxt()" style="min-width: auto;">Exportar .txt</button>
                <button class="btn-danger" onclick="limparHistorico()" style="min-width: auto;">Limpar Histórico</button>
            </div>
        </div>
    </div>

    <!-- MODAL DE INTERAÇÃO -->
    <div class="modal-overlay" id="modalQrCode">
        <div class="modal-content">
            <h3>Gerenciar QR Code</h3>
            
            <div class="config-grade">
                <label for="qtdGrade">Quantidade na folha A4:</label>
                <select id="qtdGrade" onchange="atualizarPreviewGrid()">
                    <option value="1">1 Unidade (Centralizado)</option>
                    <option value="4">Grade com 4 unidades (2x2)</option>
                    <option value="8">Grade com 8 unidades (2x4)</option>
                    <option value="12">Grade com 12 unidades (3x4)</option>
                    <option value="16" selected>Grade com 16 unidades (4x4)</option>
                </select>
            </div>

            <div class="preview-box" id="qrcode-modal-container"></div>

            <div class="modal-buttons">
                <button class="btn-secondary" onclick="fecharModal()">Fechar</button>
                <button class="btn-secondary" onclick="baixarPNG()">Baixar PNG</button>
                <button onclick="imprimirGrade()">Imprimir A4</button>
            </div>
        </div>
    </div>

    <!-- ELEMENTO OCULTO PARA IMPRESSÃO DA GRADE -->
    <div id="printSheet" class="print-sheet"></div>

    <script>
        let textoAtual = "";

        document.addEventListener("DOMContentLoaded", () => {
            atualizarListaHistorico();
        });

        async function colarDaAreaDeTransferencia() {
            try {
                const texto = await navigator.clipboard.readText();
                document.getElementById("textoInput").value = texto;
                dispararGeracao();
            } catch (err) {
                alert("Use Ctrl+V para colar o texto.");
            }
        }

        function dispararGeracao() {
            const texto = document.getElementById("textoInput").value.trim();
            if (!texto) {
                alert("Por favor, insira algum texto ou link.");
                return;
            }
            textoAtual = texto;
            abrirModalComTexto(texto);
            salvarNoHistorico(texto);
        }

        function abrirModalComTexto(texto) {
            textoAtual = texto;
            atualizarPreviewGrid();
            document.getElementById("modalQrCode").style.display = "flex";
        }

        function atualizarPreviewGrid() {
            const container = document.getElementById("qrcode-modal-container");
            container.innerHTML = "";

            const divTemp = document.createElement("div");
            new QRCode(divTemp, {
                text: textoAtual,
                width: 150,
                height: 150,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.M
            });
            container.appendChild(divTemp);
        }

        function fecharModal() {
            document.getElementById("modalQrCode").style.display = "none";
        }

        function baixarPNG() {
            const tempDiv = document.createElement("div");
            new QRCode(tempDiv, {
                text: textoAtual,
                width: 500,
                height: 500,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.M
            });

            setTimeout(() => {
                const img = tempDiv.querySelector("img");
                const canvas = tempDiv.querySelector("canvas");
                let dataUrl = "";

                if (img && img.src) {
                    dataUrl = img.src;
                } else if (canvas) {
                    dataUrl = canvas.toDataURL("image/png");
                }

                if (dataUrl) {
                    const a = document.createElement("a");
                    a.href = dataUrl;
                    a.download = "qrcode.png";
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                } else {
                    alert("Erro ao gerar a imagem PNG.");
                }
            }, 100);
        }

        function imprimirGrade() {
            const qtd = parseInt(document.getElementById("qtdGrade").value);
            const sheet = document.getElementById("printSheet");
            sheet.innerHTML = "";

            let cols = 1, rows = 1;
            if (qtd === 4) { cols = 2; rows = 2; }
            else if (qtd === 8) { cols = 2; rows = 4; }
            else if (qtd === 12) { cols = 3; rows = 4; }
            else if (qtd === 16) { cols = 4; rows = 4; }

            sheet.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
            sheet.style.gridTemplateRows = `repeat(${rows}, 1fr)`;

            for (let i = 0; i < qtd; i++) {
                const itemBox = document.createElement("div");
                itemBox.style.display = "flex";
                itemBox.style.justifyContent = "center";
                itemBox.style.alignItems = "center";
                itemBox.style.padding = "5px";
                
                const qrDiv = document.createElement("div");
                new QRCode(qrDiv, {
                    text: textoAtual,
                    width: 140,
                    height: 140,
                    colorDark: "#000000",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.M
                });
                
                itemBox.appendChild(qrDiv);
                sheet.appendChild(itemBox);
            }

            setTimeout(() => {
                window.print();
            }, 200);
        }

        window.onclick = function(event) {
            const modal = document.getElementById("modalQrCode");
            if (event.target === modal) {
                fecharModal();
            }
        }

        function obterHistorico() {
            const historicoStr = localStorage.getItem("qrcode_historico");
            return historicoStr ? JSON.parse(historicoStr) : [];
        }

        function salvarNoHistorico(texto) {
            let historico = obterHistorico();
            const agora = new Date().toLocaleString("pt-BR");

            if (historico.length > 0 && historico[0].texto === texto) return; 

            historico.unshift({ texto, data: agora });
            if (historico.length > 50) historico.pop();

            localStorage.setItem("qrcode_historico", JSON.stringify(historico));
            atualizarListaHistorico();
        }

        function atualizarListaHistorico() {
            const lista = document.getElementById("listaHistorico");
            const historico = obterHistorico();

            if (historico.length === 0) {
                lista.innerHTML = '<span style="color: var(--text-muted); font-size: 0.85rem; text-align: center; padding: 15px;">Nenhum histórico recente.</span>';
                return;
            }

            lista.innerHTML = "";
            historico.forEach((item, index) => {
                const div = document.createElement("div");
                div.className = "history-item";
                div.innerHTML = `
                    <div class="history-info">
                        <div class="history-text" title="${escapeHtml(item.texto)}">${escapeHtml(item.texto)}</div>
                        <div class="history-date">${item.data}</div>
                    </div>
                    <div class="history-actions">
                        <button class="btn-secondary" onclick="regerar(${index})">Abrir</button>
                        <button class="btn-danger" onclick="excluirItem(${index})">X</button>
                    </div>
                `;
                lista.appendChild(div);
            });
        }

        function regerar(index) {
            const historico = obterHistorico();
            if (historico[index]) {
                document.getElementById("textoInput").value = historico[index].texto;
                abrirModalComTexto(historico[index].texto);
            }
        }

        function excluirItem(index) {
            let historico = obterHistorico();
            historico.splice(index, 1);
            localStorage.setItem("qrcode_historico", JSON.stringify(historico));
            atualizarListaHistorico();
        }

        function limparHistorico() {
            if (confirm("Deseja realmente apagar todo o histórico?")) {
                localStorage.removeItem("qrcode_historico");
                atualizarListaHistorico();
            }
        }

        function exportarTxt() {
            const historico = obterHistorico();
            if (historico.length === 0) {
                alert("Não há histórico para exportar.");
                return;
            }

            let conteudo = "=== HISTÓRICO DE QR CODES ===\n\n";
            historico.forEach((item, i) => {
                conteudo += `[${i + 1}] Data: ${item.data}\nConteúdo: ${item.texto}\n----------------------------------------\n`;
            });

            const blob = new Blob([conteudo], { type: "text/plain;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "historico_qrcodes.txt";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
