<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de QR Code Offline</title>
    <!-- Biblioteca QRCode.js via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg-main: #121212;
            --bg-card: #1e1e1e;
            --border-color: #333333;
            --accent-blue: #0d47a1;
            --accent-blue-hover: #1565c0;
            --text-main: #e0e0e0;
            --text-muted: #aaaaaa;
            --danger: #c62828;
            --danger-hover: #d32f2f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: var(--accent-blue);
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }

        .card h2 {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: var(--text-main);
            border-bottom: 2px solid var(--accent-blue);
            padding-bottom: 8px;
        }

        textarea {
            width: 100%;
            height: 120px;
            background-color: #2a2a2a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            padding: 12px;
            font-size: 0.95rem;
            resize: none;
            margin-bottom: 12px;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        button {
            flex: 1;
            background-color: var(--accent-blue);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 15px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--accent-blue-hover);
        }

        button.btn-secondary {
            background-color: #424242;
        }
        button.btn-secondary:hover {
            background-color: #616161;
        }

        button.btn-danger {
            background-color: var(--danger);
        }
        button.btn-danger:hover {
            background-color: var(--danger-hover);
        }

        .history-list {
            max-height: 320px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .history-item {
            background-color: #2a2a2a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .history-info {
            overflow: hidden;
            flex: 1;
        }

        .history-text {
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-main);
        }

        .history-date {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 3px;
        }

        .history-actions {
            display: flex;
            gap: 5px;
        }

        .history-actions button {
            padding: 5px 10px;
            font-size: 0.8rem;
        }

        .full-width {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* --- ESTILOS DO MODAL --- */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.75);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            width: 350px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .modal-content h3 {
            margin-bottom: 15px;
            font-size: 1.1rem;
            color: var(--text-main);
        }

        #qrcode-modal-container {
            background: white;
            padding: 15px;
            border-radius: 8px;
            display: inline-block;
            margin-bottom: 20px;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        /* --- CONFIGURAÇÃO DE IMPRESSÃO (Oculta tudo exceto o modal na hora de imprimir) --- */
        @media print {
            body * {
                visibility: hidden;
            }
            #modalQrCode, #modalQrCode * {
                visibility: visible;
            }
            #modalQrCode {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                height: 100%;
                background: white !important;
                display: flex !important;
                justify-content: center;
                align-items: center;
            }
            .modal-content {
                background: white !important;
                border: none !important;
                box-shadow: none !important;
            }
            .modal-content h3 {
                color: black !important;
            }
            .modal-buttons {
                display: none !important; /* Esconde os botões Fechar/Imprimir no papel */
            }
        }
    </style>
</head>
<body>

    <header>
        Gerador de QR Code Grátis
    </header>

    <div class="container">
        <!-- Coluna Única: Gerador -->
        <div class="card">
            <h2>Novo QR Code</h2>
            <textarea id="textoInput" placeholder="Digite ou cole o texto/link aqui..."></textarea>
            
            <div class="btn-group">
                <button class="btn-secondary" onclick="colarDaAreaDeTransferencia()">Colar da Área de Transferência</button>
                <button onclick="dispararGeracao()">Gerar QR Code</button>
            </div>
        </div>

        <!-- Histórico Recente -->
        <div class="card">
            <h2>Histórico Recente</h2>
            <div class="history-list" id="listaHistorico">
                <!-- Itens injetados via JS -->
            </div>
        </div>

        <!-- Rodapé do Container com ações globais -->
        <div class="card full-width" style="padding: 15px 20px;">
            <span style="font-size: 0.85rem; color: var(--text-muted);">Salvamento seguro no navegador local.</span>
            <div style="display: flex; gap: 10px;">
                <button class="btn-secondary" onclick="exportarTxt()" style="padding: 8px 15px;">Exportar .txt</button>
                <button class="btn-danger" onclick="limparHistorico()" style="padding: 8px 15px;">Limpar Histórico</button>
            </div>
        </div>
    </div>

    <!-- MODAL DO QR CODE -->
    <div class="modal-overlay" id="modalQrCode">
        <div class="modal-content">
            <h3>QR Code Gerado</h3>
            <div id="qrcode-modal-container"></div>
            <div class="modal-buttons">
                <button class="btn-secondary" onclick="fecharModal()">Fechar</button>
                <button onclick="imprimirQRCode()">Imprimir</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            atualizarListaHistorico();
        });

        async function colarDaAreaDeTransferencia() {
            try {
                const texto = await navigator.clipboard.readText();
                document.getElementById("textoInput").value = texto;
                dispararGeracao();
            } catch (err) {
                alert("Use Ctrl+V para colar o texto.");
            }
        }

        function dispararGeracao() {
            const texto = document.getElementById("textoInput").value.trim();
            if (!texto) {
                alert("Por favor, insira algum texto ou link.");
                return;
            }
            gerarQRCodeNoModal(texto);
            salvarNoHistorico(texto);
        }

        function gerarQRCodeNoModal(texto) {
            const container = document.getElementById("qrcode-modal-container");
            container.innerHTML = ""; // Limpa anterior

            // Cria o QR Code dentro do modal
            new QRCode(container, {
                text: texto,
                width: 200,
                height: 200,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });

            // Mostra o modal
            document.getElementById("modalQrCode").style.display = "flex";
        }

        function fecharModal() {
            document.getElementById("modalQrCode").style.display = "none";
        }

        function imprimirQRCode() {
            window.print();
        }

        // Fecha o modal se clicar fora da caixa central
        window.onclick = function(event) {
            const modal = document.getElementById("modalQrCode");
            if (event.target === modal) {
                fecharModal();
            }
        }

        function obterHistorico() {
            const historicoStr = localStorage.getItem("qrcode_historico");
            return historicoStr ? JSON.parse(historicoStr) : [];
        }

        function salvarNoHistorico(texto) {
            let historico = obterHistorico();
            const agora = new Date().toLocaleString("pt-BR");

            if (historico.length > 0 && historico[0].texto === texto) {
                return; 
            }

            historico.unshift({ texto, data: agora });
            if (historico.length > 50) historico.pop();

            localStorage.setItem("qrcode_historico", JSON.stringify(historico));
            atualizarListaHistorico();
        }

        function atualizarListaHistorico() {
            const lista = document.getElementById("listaHistorico");
            const historico = obterHistorico();

            if (historico.length === 0) {
                lista.innerHTML = '<span style="color: var(--text-muted); font-size: 0.9rem; text-align: center; padding: 20px;">Nenhum QR Code no histórico.</span>';
                return;
            }

            lista.innerHTML = "";
            historico.forEach((item, index) => {
                const div = document.createElement("div");
                div.className = "history-item";
                div.innerHTML = `
                    <div class="history-info">
                        <div class="history-text" title="${escapeHtml(item.texto)}">${escapeHtml(item.texto)}</div>
                        <div class="history-date">${item.data}</div>
                    </div>
                    <div class="history-actions">
                        <button class="btn-secondary" onclick="regerar(${index})">Abrir</button>
                        <button class="btn-danger" onclick="excluirItem(${index})">X</button>
                    </div>
                `;
                lista.appendChild(div);
            });
        }

        function regerar(index) {
            const historico = obterHistorico();
            if (historico[index]) {
                document.getElementById("textoInput").value = historico[index].texto;
                gerarQRCodeNoModal(historico[index].texto);
            }
        }

        function excluirItem(index) {
            let historico = obterHistorico();
            historico.splice(index, 1);
            localStorage.setItem("qrcode_historico", JSON.stringify(historico));
            atualizarListaHistorico();
        }

        function limparHistorico() {
            if (confirm("Deseja realmente apagar todo o histórico?")) {
                localStorage.removeItem("qrcode_historico");
                atualizarListaHistorico();
            }
        }

        function exportarTxt() {
            const historico = obterHistorico();
            if (historico.length === 0) {
                alert("Não há histórico para exportar.");
                return;
            }

            let conteudo = "=== HISTÓRICO DE QR CODES ===\n\n";
            historico.forEach((item, i) => {
                conteudo += `[${i + 1}] Data: ${item.data}\nConteúdo: ${item.texto}\n----------------------------------------\n`;
            });

            const blob = new Blob([conteudo], { type: "text/plain;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "historico_qrcodes.txt";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
