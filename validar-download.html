<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JC-Softwares | Validação de Acesso</title>
    
    <style>
        :root {
            --fundo-principal: #121214;
            --fundo-card: #1e1e24;
            --texto-claro: #ffffff;
            --texto-mutado: #a0a0a0;
            --borda-sutil: rgba(255, 255, 255, 0.1);
            --azul-destaque: #0066cc;
            --azul-hover: #0052a3;
            --vermelho-erro: #ff5555;
            --verde-sucesso: #00cc66;
        }

        body {
            background-color: var(--fundo-principal);
            color: var(--texto-claro);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .card-validacao {
            background-color: var(--fundo-card);
            border: 1px solid var(--borda-sutil);
            border-radius: 12px;
            padding: 30px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        .card-validacao h2 {
            margin-top: 0;
            font-size: 1.4rem;
            color: var(--texto-claro);
        }

        .card-validacao p {
            color: var(--texto-mutado);
            font-size: 0.9rem;
            line-height: 1.4;
            margin-bottom: 20px;
        }

        .input-email {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            background-color: var(--fundo-principal);
            border: 1px solid #323238;
            border-radius: 8px;
            color: #ffffff;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-email:focus {
            border-color: var(--azul-destaque);
        }

        .btn-validar {
            width: 100%;
            padding: 14px;
            background-color: var(--azul-destaque);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-validar:hover {
            background-color: var(--azul-hover);
        }

        .btn-home {
            display: inline-block;
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background-color: transparent;
            color: var(--texto-mutado);
            border: 1px solid var(--borda-sutil);
            border-radius: 8px;
            font-size: 0.9rem;
            text-decoration: none;
            box-sizing: border-box;
            transition: all 0.2s;
        }

        .btn-home:hover {
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--texto-claro);
        }

        .msg-status {
            margin-top: 15px;
            font-size: 0.85rem;
            display: none;
            padding: 10px;
            border-radius: 6px;
        }

        .msg-erro {
            background: rgba(255, 85, 85, 0.1);
            color: var(--vermelho-erro);
            border: 1px solid rgba(255, 85, 85, 0.2);
        }

        .msg-sucesso {
            background: rgba(0, 204, 102, 0.1);
            color: var(--verde-sucesso);
            border: 1px solid rgba(0, 204, 102, 0.2);
        }

        .contador {
            font-weight: bold;
            color: var(--azul-destaque);
        }
    </style>
</head>
<body>

    <div class="card-validacao" id="boxValidacao">
        <h2>🔒 Liberação do Download</h2>
        <p>Para confirmar sua autorização, digite o mesmo <strong>e-mail</strong> onde você recebeu o link de acesso.</p>

        <form id="formValidacao" onsubmit="validarAcesso(event)">
            <input type="email" id="emailUsuario" class="input-email" placeholder="seu-email@exemplo.com" required autocomplete="email">
            <button type="submit" class="btn-validar">✨ Liberar e Baixar (.exe)</button>
        </form>

        <div id="mensagemStatus" class="msg-status"></div>

        <!-- Tela de Sucesso Completo (exibida após acertar o e-mail) -->
        <div id="areaSucesso" style="display: none;">
            <a href="index.html" class="btn-home">🏠 Voltar ao Início</a>
        </div>
    </div>

    <script>
        const urlInstaladorExe = "https://github.com/JC-Softwares/JCSoftwares_Config/releases/download/1.0.0/JC.Softwares.-.Gestao.Comercial-1.0.0.Setup.exe";

        let dadosToken = null;

        document.addEventListener("DOMContentLoaded", function() {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');

            if (!token) {
                bloquearETeleportar("Acesso não autorizado. Nenhum token de segurança foi encontrado na URL.");
                return;
            }

            try {
                const textoDecodificado = atob(token);
                const partes = textoDecodificado.split('|');

                if (partes.length < 2) {
                    bloquearETeleportar("Token de acesso inválido ou corrompido.");
                    return;
                }

                dadosToken = {
                    emailAutorizado: partes[0].trim().toLowerCase(),
                    timestampCriacao: partes[1].trim() 
                };

                if (!validarValidade24Horas(dadosToken.timestampCriacao)) {
                    bloquearETeleportar("⏱️ Este link de teste expirou! Por favor, faça um novo pedido de link no site.");
                }

            } catch (e) {
                bloquearETeleportar("Token de segurança inválido.");
            }
        });

        function validarValidade24Horas(strTimestamp) {
            const ano = parseInt(strTimestamp.substring(0, 4));
            const mes = parseInt(strTimestamp.substring(4, 6)) - 1; 
            const dia = parseInt(strTimestamp.substring(6, 8));
            const hora = parseInt(strTimestamp.substring(8, 10));
            const minuto = parseInt(strTimestamp.substring(10, 12));
            const segundo = parseInt(strTimestamp.substring(12, 14));

            const dataCriacao = new Date(ano, mes, dia, hora, minuto, segundo);
            const dataAtual = new Date();

            const diferencaMS = dataAtual.getTime() - dataCriacao.getTime();
            const limite24HorasMS = 86400000;

            return diferencaMS >= 0 && diferencaMS <= limite24HorasMS;
        }

        function validarAcesso(event) {
            event.preventDefault();
            const emailDigitado = document.getElementById("emailUsuario").value.trim().toLowerCase();
            const divStatus = document.getElementById("mensagemStatus");
            const formValidacao = document.getElementById("formValidacao");
            const areaSucesso = document.getElementById("areaSucesso");

            if (!dadosToken) return;

            if (emailDigitado === dadosToken.emailAutorizado) {
                // Esconde o formulário (input e botão de liberar)
                formValidacao.style.display = "none";

                // Exibe a mensagem de sucesso e o botão da Home
                divStatus.className = "msg-status msg-sucesso";
                divStatus.innerText = "✅ E-mail verificado com sucesso! Seu download começará em instantes...";
                divStatus.style.display = "block";
                areaSucesso.style.display = "block";
                
                // Dispara o download automático do arquivo
                setTimeout(() => {
                    window.location.href = urlInstaladorExe;
                }, 1500);
            } else {
                divStatus.className = "msg-status msg-erro";
                divStatus.innerText = "❌ E-mail não confere com o e-mail autorizador deste link.";
                divStatus.style.display = "block";
            }
        }

        function bloquearETeleportar(mensagem) {
            const box = document.getElementById("boxValidacao");
            let segundos = 5;

            box.innerHTML = `
                <h3 style="color: var(--vermelho-erro); margin-top: 0;">Acesso Indisponível</h3>
                <p style="color: var(--texto-mutado);">${mensagem}</p>
                <p style="font-size: 0.85rem; color: var(--texto-mutado); margin-top: 15px;">
                    Redirecionando para a página inicial em <span id="tempoRedirecionar" class="contador">${segundos}</span> segundos...
                </p>
                <a href="/download/index.html" class="btn-home" style="margin-top: 10px;">Ir para o Início Agora</a>
            `;

            const intervalo = setInterval(() => {
                segundos--;
                const elContador = document.getElementById("tempoRedirecionar");
                if (elContador) elContador.innerText = segundos;

                if (segundos <= 0) {
                    clearInterval(intervalo);
                    window.location.href = "/download/index.html";
                }
            }, 1000);
        }
    </script>
</body>
</html>
